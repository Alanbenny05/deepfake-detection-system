{% extends 'base.html' %}

{% block title %}Login - Deepfake Detection{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Login</h4>
                </div>
                <div class="card-body p-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" name="username" id="id_username" 
                                   class="form-control form-control-lg" 
                                   placeholder="Enter your username" required>
                        </div>
                        <div class="mb-3 position-relative">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" id="id_password" 
                                   class="form-control form-control-lg" 
                                   placeholder="Enter your password" required>
                            <span class="password-toggle" data-target="#id_password" role="button" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-1">Don't have an account?</p>
                        <a href="{% url 'users:register' %}" class="btn btn-outline-success btn-sm">
                            <i class="fas fa-user-plus me-1"></i>Register Now
                        </a>
                    </div>
                    <div class="text-center mt-2">
                        <small>
                            <a href="{% url 'users:password_reset' %}" class="text-muted">
                                Forgot Password?
                            </a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
