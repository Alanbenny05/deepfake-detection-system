{% extends 'base.html' %}

{% block title %}Password Reset Complete - Deepfake Detection{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 text-center">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-check-circle me-2"></i>Password Reset Complete</h4>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4 text-success">
                        <i class="fas fa-shield-alt fa-3x"></i>
                    </div>
                    <h5>Your Password Has Been Set</h5>
                    <p class="text-muted">
                        Your password has been changed successfully. You can now log in with your new credentials.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'users:login' %}" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Log In Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
