{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password - Deepfake Detection{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-key"></i> Change Password</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3 position-relative">
                            <label class="form-label">Old Password</label>
                            <input type="password" name="old_password" id="id_old_password" class="form-control" required>
                            <span class="password-toggle" data-target="#id_old_password" role="button" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <div class="mb-3 position-relative">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                            <span class="password-toggle" data-target="#id_new_password1" role="button" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <div class="mb-3 position-relative">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                            <span class="password-toggle" data-target="#id_new_password2" role="button" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
