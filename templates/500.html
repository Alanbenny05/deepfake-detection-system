{% extends 'base.html' %}

{% block title %}500 - Server Error | Deepfake Detection{% endblock %}

{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-5 shadow-lg border-0">
                <div class="mb-4">
                    <span class="display-1 fw-bold text-danger">500</span>
                </div>
                <div class="mb-3 text-muted">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3 text-danger opacity-75"></i>
                    <h3 class="fw-bold text-dark">Internal Server Error</h3>
                    <p class="mt-2">
                        Something unexpected occurred while processing your request. Our system logged the incident and is working to resolve it.
                    </p>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'home' %}" class="btn btn-primary px-4">
                        <i class="fas fa-home me-2"></i>Return Home
                    </a>
                    <button onclick="window.location.reload();" class="btn btn-outline-secondary px-4">
                        <i class="fas fa-redo me-2"></i>Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
